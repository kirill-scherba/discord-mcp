<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Говорилка — прототип</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 18px; padding: 12px 20px; margin: 8px 4px; cursor: pointer; }
  #status { margin-top: 16px; font-size: 14px; color: #666; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Говорилка 🐪</h1>
<p>
  Микрофон:
  <select id="micselect"><option value="">(по умолчанию)</option></select>
  <button id="refreshmics">Обновить</button>
</p>
<button id="connect">Подключиться</button>
<button id="disconnect" disabled>Отключиться</button>
<div id="status"></div>

<script>
const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connect');
const disconnectBtn = document.getElementById('disconnect');
const micSelect = document.getElementById('micselect');
const refreshBtn = document.getElementById('refreshmics');

let pc = null;
let ws = null;
let micStream = null;

function log(msg) { statusEl.textContent += msg + '\n'; }

function signal(type, data) {
  ws.send(JSON.stringify({ signal: type, data }));
}

// ensureMic gets the microphone once; reused across reconnects.
async function ensureMic() {
  if (micStream) return micStream;
  log('Запрашиваю микрофон...');
  const audioConstraints = {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: false
  };
  const micId = micSelect.value;
  if (micId) {
    audioConstraints.deviceId = { exact: micId };
    localStorage.setItem('govorilka_mic', micId);
  }
  micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
  return micStream;
}

// List microphones so the user picks the right one (browser default may be
// a wrong/quiet device). Choice is remembered in localStorage.
async function refreshMics() {
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    micSelect.innerHTML = '<option value="">(по умолчанию)</option>';
    mics.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || ('Микрофон ' + (micSelect.length));
      micSelect.appendChild(opt);
    });
    const saved = localStorage.getItem('govorilka_mic');
    if (saved) micSelect.value = saved;
    log('Микрофонов найдено: ' + mics.length);
  } catch (e) {
    log('Ошибка доступа к микрофонам: ' + e.message);
  }
}
refreshBtn.onclick = refreshMics;

async function connect() {
  try {
    const stream = await ensureMic();

    log('Создаю WebRTC...');
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    // Микрофон → аудио-трек на сервер
    stream.getAudioTracks().forEach(t => pc.addTrack(t, stream));

  // Ответ сервера (TTS-речь) → плеер. Один audio-элемент на всё
  // соединение: пересоздание в каждом ontrack ломает autoplay в Chrome.
  const replyAudio = document.createElement('audio');
  replyAudio.autoplay = true;
  document.body.appendChild(replyAudio);
  pc.ontrack = (ev) => {
    log('Трек ответа получен от сервера');
    replyAudio.srcObject = ev.streams[0];
    replyAudio.play().then(() => {
      log('Воспроизведение началось');
    }).catch(e => log('Play blocked: ' + e.message));
  };
  replyAudio.onerror = (e) => log('Audio error: ' + (e.target.error ? e.target.error.message : 'unknown'));

  pc.onicecandidate = (ev) => { if (ev.candidate) signal('candidate', ev.candidate.toJSON()); };
  pc.onconnectionstatechange = () => {
    log('Состояние: ' + pc.connectionState);
    if (pc.connectionState === 'connected') {
      // WebSocket больше не нужен (звук идёт по WebRTC напрямую).
      // Закрываем его сами, чтобы его закрытие не вызывало реконнект.
      if (ws) {
        ws.onclose = null;
        ws.close();
        ws = null;
        log('Сигналинг закрыт (не нужен после соединения).');
      }
    }
    // Автопереподключение при обрыве: disconnected/failed → пересоздать.
    if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      log('Соединение потеряно, переподключаюсь...');
      setTimeout(() => reconnect(), 1500);
    }
  };

  // Сигналинг по WebSocket
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/signal');
  ws.onopen = async () => {
    log('Сигналинг открыт, шлю offer...');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    signal('offer', offer);
  };
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.signal === 'answer') {
      await pc.setRemoteDescription(msg.data);
      log('Соединение установлено! Говорите в микрофон.');
    } else if (msg.signal === 'candidate') {
      await pc.addIceCandidate(msg.data);
    }
  };

  connectBtn.disabled = true;
  disconnectBtn.disabled = false;
  } catch (e) {
    log('Ошибка подключения: ' + e.message);
    connectBtn.disabled = false;
  }
}
connectBtn.onclick = connect;

// reconnect закрывает старое соединение и создаёт новое.
let reconnectTimer = null;
async function reconnect() {
  if (reconnectTimer) return;          // уже переподключаемся
  if (!connectBtn.disabled) return;    // соединение не активно (отключены вручную)
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
  }, 3000);

  log('Reconnect: закрываю старое соединение...');
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }

  // Пересоздаём соединение (микрофон уже запрошен ранее).
  try {
    await connect();
    log('Reconnect: соединение восстановлено.');
  } catch (e) {
    log('Reconnect: ошибка — ' + e.message + '. Повторю через 3 сек.');
    setTimeout(() => { reconnectTimer = null; reconnect(); }, 3000);
  }
}

disconnectBtn.onclick = () => {
  if (pc) pc.close();
  if (ws) ws.close();
  pc = ws = null;
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
  log('Отключено.');
};

// Watchdog: WebRTC often stays in "connected" state on a dead channel
// (server restart) — ICE keepalive takes a long time to notice, so
// onconnectionstatechange may never fire. Every 5s check whether the
// connection is actually alive; if not (or stuck in connecting for a
// while), reconnect.
let stuckSince = 0;
setInterval(() => {
  if (!pc || !disconnectBtn.disabled) return; // not connected
  const st = pc.connectionState;
  if (st === 'disconnected' || st === 'failed') {
    if (reconnectTimer) return;
    log('Watchdog: соединение ' + st + ', переподключаюсь...');
    reconnect();
  } else if (st === 'connecting') {
    // Only force if connecting takes too long (>=10s) — a fresh connect
    // legitimately spends a couple seconds in connecting.
    if (stuckSince === 0) stuckSince = Date.now();
    if (Date.now() - stuckSince > 10000) {
      stuckSince = 0;
      if (reconnectTimer) return;
      log('Watchdog: connecting слишком долго, переподключаюсь...');
      reconnect();
    }
  } else {
    stuckSince = 0; // connected / new — reset the timer
  }
}, 5000);
</script>
</body>
</html>
