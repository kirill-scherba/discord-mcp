# Release: Linux with voice, Windows as text tools.
#
# Voice needs libopus and libdave. libdave used to look like an unbuildable C++ dependency; Discord
# publishes prebuilt archives (MIT) for Linux and Windows, so the build is reproducible: download the
# archive, point CGO at it, and ship libdave.so next to the binary with an $ORIGIN rpath.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      DAVE_VERSION: v1.2.2
      DAVE_URL: https://github.com/discord/libdave/releases/download/v1.2.2%2Fcpp/libdave-Linux-X64-boringssl.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev

      - name: libdave
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/libdave.zip "$DAVE_URL"
          mkdir -p third_party/libdave
          unzip -q -o /tmp/libdave.zip -d third_party/libdave
          ls third_party/libdave/lib

      - name: Build with voice
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I${{ github.workspace }}/third_party/libdave/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/third_party/libdave/lib -ldave -Wl,-rpath,$ORIGIN"
        run: go build -trimpath -ldflags "-s -w" -o discord-mcp .

      - name: Pack
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          zip="discord-mcp_${tag}_linux-amd64.zip"
          cp third_party/libdave/lib/libdave.so .
          zip -q "$zip" discord-mcp libdave.so
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            discord-mcp_*_linux-amd64.zip
            discord-mcp_*_linux-amd64.zip.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Text only for now: the voice build on Windows needs MinGW plus opus and libdave DLLs; the
      # text tools are what a person on a desktop uses.
      - name: Build (text only)
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -tags novoice -trimpath -ldflags "-s -w" -o discord-mcp.exe .
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          zip="discord-mcp_${tag}_windows-amd64.zip"
          powershell -NoProfile -Command "Compress-Archive -Path discord-mcp.exe -DestinationPath '$zip' -Force"
          sha256sum "$zip" > "$zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            discord-mcp_*_windows-amd64.zip
            discord-mcp_*_windows-amd64.zip.sha256
